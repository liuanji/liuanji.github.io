[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "servermonitor"
version = "0.1.0"
description = "A small local NVIDIA GPU usage dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gpu-monitor = "servermonitor.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["servermonitor*"]

[tool.setuptools.package-data]
servermonitor = ["static/*"]
